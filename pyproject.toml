[project]
name = "openwebui-chatgpt-connect"
version = "0.4.0"
description = "Connect Open WebUI to ChatGPT subscriptions through the official SIWC API."
authors = [{ name = "huangboming" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx",
    "PyJWT[crypto]",
]

[dependency-groups]
dev = [
    "fastapi==0.136.3",
    "pytest>=8",
    "pytest-asyncio>=1",
    "ruff>=0.15",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openwebui_chatgpt_connect"]

[tool.openwebui-chatgpt-connect]
title = "ChatGPT Connect"
required-open-webui-version = "0.11.4"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["dist"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
ignore = ["B008"] # FastAPI dependencies use Depends() in signatures.
